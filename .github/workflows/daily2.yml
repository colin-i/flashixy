name: Sync plays.txt from artifact and release

on:
 workflow_dispatch:
 schedule:
  - cron: '0 0 * * *'
    timezone: 'Europe/Bucharest'
 inputs:
  maxdif:
   description: "max difference"

jobs:
 sync:
  runs-on: ubuntu-latest

  steps:
   - name: Download latest daily.yml artifact
     uses: dawidd6/action-download-artifact@v9
     with:
      github_token: ${{ secrets.PAT }}
      workflow: daily.yml
      workflow_conclusion: success
      name: plays.txt
      path: artifact
   - name: Show downloaded artifact
     run: |
      echo "Artifact:"
      cat artifact/plays.txt
   - name: Download plays.txt from latest release
     env:
      GH_TOKEN: ${{ secrets.PAT }}
     run: |
      TAG=$(gh release list --repo colin-i/colin-i.github.io --json tagName --jq '.[0].tagName')
      gh release download "$TAG" --repo colin-i/colin-i.github.io --pattern plays.txt
   - name: Show release asset
     run: |
      echo "Release asset:"
      cat plays.txt

   - name: Validate plays.txt
     shell: bash
     run: |
      release_content=$(cat plays.txt)
      artifact_content=$(cat artifact/plays.txt)

      if [ "$release_content" = "$artifact_content" ]; then
       echo "Equals"
       exit 1
      fi
      if [[ "$release_content" != *";"* ]]; then
       echo "Invalid release format"
       exit 1
      fi
      if [[ "$artifact_content" != *";"* ]]; then
       echo "Invalid artifact format"
       exit 1
      fi

      release_values="${release_content#*;}"

      artifact_indexes="${artifact_content%%;*}"
      artifact_values="${artifact_content#*;}"

      read -ra release_arr <<< "$release_values"
      read -ra artifact_arr <<< "$artifact_values"
      read -ra artifact_sorted_indexes <<< "$artifact_indexes"

      echo "Release values count: ${#release_arr[@]}"
      echo "Artifact values count: ${#artifact_arr[@]}"
      echo

      if [ "${#release_arr[@]}" -ne "${#artifact_arr[@]}" ]; then
       echo "Array size mismatch"
       exit 1
      fi

      echo "Checking value ranges..."
      if [ -z "${{ inputs.maxdif }}" ]; then
       z=300
      else
       z=${{ inputs.maxdif }}
      fi
      for i in "${!release_arr[@]}"; do
       r=${release_arr[$i]}
       a=${artifact_arr[$i]}

       echo "Index $i -> release=$r artifact=$a allowed=[${r},$((r+z-1))]"

       if (( a < r || a >= r + z )); then
        echo "FAILED at index $i"
        exit 1
       fi
      done

      echo
      echo "Range validation passed"
      echo

      echo "Validating sorted indexes..."

      declare -a sorted_arr=()

      for idx in "${artifact_sorted_indexes[@]}"; do
       if (( idx < 0 || idx >= ${#artifact_arr[@]} )); then
        echo "Invalid sorted index: $idx"
        exit 1
       fi
       value=${artifact_arr[$idx]}
       echo "push $value from idx=$idx"
       sorted_arr+=("$value")
      done

      echo
      echo "Checking array size..."

      if [ "${#sorted_arr[@]}" -ne "${#artifact_arr[@]}" ]; then
       echo "sorted_arr size mismatch"
       exit 1
      fi

      echo "Checking descending order..."

      prev=-1

      for ((i=0; i<${#sorted_arr[@]}; i++)); do
       value=${sorted_arr[$i]}

       echo "$i -> $value"

       if (( prev != -1 && value > prev )); then
        echo "Descending order validation failed"
        echo "Value $value is greater than previous $prev"
        exit 1
       fi

       prev=$value
      done

      echo
      echo "Sorted index validation passed"
   - name: Upload updated plays.txt to release
     env:
      GH_TOKEN: ${{ secrets.PAT }}
     run: |
      TAG=$(gh release list --repo colin-i/colin-i.github.io --json tagName --jq '.[0].tagName')
      echo "Using tag: $TAG"
      cd artifact
      gh release upload "$TAG" --repo colin-i/colin-i.github.io --clobber plays.txt
   - name: Trigger deploy workflow
     env:
      GH_TOKEN: ${{ secrets.PAT }}
     run: |
      gh workflow run deploy.yml --repo colin-i/colin-i.github.io --ref deploy -f branch=main
      echo "Deploy workflow triggered"
